name: bench

# Live benchmark runs on a clean GitHub runner, under Bun (recommended) and Node.
# Manual only: Actions -> bench -> Run workflow.
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub/models--BAAI--bge-m3
          key: bge-m3-${{ runner.os }}

      - name: Bench source (>= 70 KB of plain text)
        run: cat src/*.rs > book.txt

      - name: bench.ts on a live server (Bun, then Node)
        env:
          BENCH_SOURCE: book.txt
          BENCH_ROUNDS: "1"
          BENCH_BATCH: "4"
        run: |
          ./target/release/bge-embed-rs --headless > server.log 2>&1 &
          SERVER=$!
          trap 'echo "--- server.log"; cat server.log; kill $SERVER' EXIT
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:11435/health && break; sleep 5; done
          echo "=== bun"; bun bench.ts live=11435
          echo "=== node"; node bench.ts live=11435

      - name: lane-bench.ts, throughput mode (Bun, then Node)
        env:
          BENCH_SOURCE: book.txt
        run: |
          echo "=== bun"; bun lane-bench.ts gated=./target/release/bge-embed-rs\|1 --throughput
          echo "=== node"; node lane-bench.ts gated=./target/release/bge-embed-rs\|1 --throughput
