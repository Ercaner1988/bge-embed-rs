name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # runs the smoke test without tagging (release job stays tag-only)

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --release --workspace
      - run: cargo test --release --workspace --features ibnun-nedim/fihrist

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc,    os: windows-latest,   smoke: true }
          - { target: aarch64-pc-windows-msvc,   os: windows-11-arm,   smoke: true }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04,     smoke: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, smoke: true }
          - { target: aarch64-apple-darwin,      os: macos-14,         smoke: true }
          # Cross-built on Apple Silicon; Rosetta has no AVX2, so it cannot be smoke-tested here.
          - { target: x86_64-apple-darwin,       os: macos-14,         smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ibnun-nedim$ext" "dist/ibnun-nedim-${{ matrix.target }}$ext"
          echo "BIN=dist/ibnun-nedim-${{ matrix.target }}$ext" >> "$GITHUB_ENV"

      - name: Cache model
        if: matrix.smoke && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub/models--BAAI--bge-m3
          key: bge-m3-${{ runner.os }}

      - name: Smoke test (download model, embed one text)
        if: matrix.smoke && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          # --headless: CI runners have no display, and the default GUI mode
          # exits when eframe can't open a window (taking the server with it).
          "$BIN" --headless > server.log 2>&1 &
          trap 'echo "--- server.log"; cat server.log' EXIT
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:11435/health && break; sleep 5; done
          # Body from a file, not -d '...': on Windows, Git Bash hands curl's
          # argv through the ANSI code page, so the "ü" arrived as invalid
          # UTF-8 and the server rightly rejected it. printf writes raw bytes.
          printf '%s' '{"model":"bge-m3","input":"Merhaba dünya / hello world"}' > body.json
          code=$(curl -s -o resp.json -w '%{http_code}' http://127.0.0.1:11435/v1/embeddings \
            -H 'Content-Type: application/json' --data-binary @body.json)
          echo "HTTP $code"; head -c 300 resp.json; echo
          test "$code" = "200"
          dim=$("$PY" -c 'import json; print(len(json.load(open("resp.json"))["data"][0]["embedding"]))')
          test "$dim" = "1024"

      - uses: actions/upload-artifact@v7
        with:
          name: ibnun-nedim-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
