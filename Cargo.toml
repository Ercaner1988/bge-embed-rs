[package]
name = "bge-embed-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-file, pure-Rust bge-m3 embedding server with an OpenAI-compatible API"
repository = "https://github.com/Ercaner1988/bge-embed-rs"

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
hf-hub = { version = "0.4", features = ["tokio"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
# ureq (blocking, rustls): already resolved transitively via hf-hub's sync
# feature (see Cargo.lock), so pulling it in directly adds no new crate to
# the tree, just a Cargo.toml entry - much smaller than pulling reqwest+tokio
# machinery onto a plain std::thread for a couple of short-lived GET/POST
# probes. tls-rustls avoids native-tls/OpenSSL; json for serde_json bodies.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
# default-features off: eframe 0.36's default renderer switched from glow to
# wgpu (0.29 defaulted to glow). wgpu's DX12 backend pulls the `windows` 0.62
# crate while another dependency in this graph pins `windows-core` 0.58,
# and the two versions of the ID3D12* interface traits don't unify - a real
# `cargo check` failure (E0277, "multiple different versions of crate
# `windows`"), not a lint. Selecting the glow renderer explicitly avoids
# pulling wgpu/windows-0.62 at all.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
