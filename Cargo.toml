[package]
name = "bge-embed-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-file, pure-Rust bge-m3 embedding server with an OpenAI-compatible API"
repository = "https://github.com/Ercaner1988/bge-embed-rs"

[dependencies]
# Ortak tema (Kilim paleti, Semerkant kâğıdı, kilim çerçeve). git + rev: kardeş
# depo yolu klonlayan herkeste ve CI'da yok. Tema değişince rev'i güncelle.
kilim-tema = { git = "https://github.com/Ercaner1988/kilim-tema", rev = "9d110ec180e37b5bc567b8c5d699e78f1c6fc174" }
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
hf-hub = { version = "0.4", features = ["tokio"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
# ureq (blocking, rustls): already resolved transitively via hf-hub's sync
# feature (see Cargo.lock), so pulling it in directly adds no new crate to
# the tree, just a Cargo.toml entry - much smaller than pulling reqwest+tokio
# machinery onto a plain std::thread for a couple of short-lived GET/POST
# probes. tls-rustls avoids native-tls/OpenSSL; json for serde_json bodies.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
# default-features off: glow (OpenGL) blanks to a black window on some
# Windows 11 + AMD/Intel-integrated-GPU combinations (Wgl sRGB swap-chain
# mismatch with DWM - el-fihrist kural 9037960d582ebfe7). wgpu's DX12 backend
# is what's actually native to Windows' compositor, so it's used instead.
# NOTE: wgpu's DX12 backend previously pulled `windows` 0.62 while another
# dependency in this graph pinned `windows-core` 0.58 (E0277, "multiple
# different versions of crate `windows`") - re-check this if bumping eframe
# ever reintroduces that conflict.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_Foundation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
